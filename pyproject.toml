[project]
name = "ledgerpilot"
version = "0.1.0"
description = "LedgerPilot AI: accounts-payable agent on Evolus, powered by an open model on AMD MI300X"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["live: calls the real AMD endpoint and Evolus (needs .env)"]
addopts = "-m 'not live'"
