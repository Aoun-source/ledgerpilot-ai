# Light and dark themes. Viewers switch in the app menu (⋮ › Settings › Theme); the default follows
# their system setting. app.py reads the active theme so its own panels match.
[theme]
font = "Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica Neue, Arial, sans-serif"
codeFont = "Cascadia Mono, SFMono-Regular, Consolas, Menlo, monospace"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "6px"
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#1F3A5F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F7"
textColor = "#1B1F24"
borderColor = "#E1E4E8"
linkColor = "#1F5FBF"
greenColor = "#1A7F37"
orangeColor = "#9A6700"
redColor = "#C4321C"
dataframeHeaderBackgroundColor = "#F6F7F9"
chartCategoricalColors = ["#1A7F37", "#9A6700", "#C4321C", "#6E7781", "#1F3A5F", "#1F5FBF", "#8250DF", "#BF3989", "#1B7C83", "#57606A"]

[theme.light.sidebar]
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#ECEEF1"
textColor = "#1B1F24"
borderColor = "#E1E4E8"

[theme.dark]
primaryColor = "#4C7DC9"
backgroundColor = "#111316"
secondaryBackgroundColor = "#1A1D21"
textColor = "#E6E8EB"
borderColor = "#2B3036"
linkColor = "#6EA3F2"
greenColor = "#3FB950"
orangeColor = "#D29922"
redColor = "#F06A57"
dataframeHeaderBackgroundColor = "#181B1F"
chartCategoricalColors = ["#3FB950", "#D29922", "#F06A57", "#8B949E", "#4C7DC9", "#6EA3F2", "#A371F7", "#DB61A2", "#39C5CF", "#8C959F"]

[theme.dark.sidebar]
backgroundColor = "#16191C"
secondaryBackgroundColor = "#1E2226"
textColor = "#E6E8EB"
borderColor = "#2B3036"

[client]
# Tracebacks go to the server log, never to the page
showErrorDetails = "none"

[server]
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false
