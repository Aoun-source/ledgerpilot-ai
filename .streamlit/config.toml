[theme]
base = "light"
primaryColor = "#1D2A36"
backgroundColor = "#F7F8F6"
secondaryBackgroundColor = "#EDF0EE"
textColor = "#1D2A36"
font = "sans serif"

[client]
# Tracebacks go to the server log, never to the page
showErrorDetails = "none"

[server]
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false
