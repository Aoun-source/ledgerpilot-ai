# LedgerPilot's theme: a calm, light fintech palette with one emerald action colour.
# app.py adds the component styles (cards, navigation, status pills) on top of these.
[theme]
base = "light"
primaryColor = "#07966F"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#F4F7FB"
textColor = "#183153"
borderColor = "#DFE7F0"
linkColor = "#3478F6"
linkUnderline = false
greenColor = "#07966F"
orangeColor = "#F5B942"
redColor = "#E5485D"
blueColor = "#3478F6"
grayColor = "#63748B"
codeTextColor = "#183153"
codeBackgroundColor = "#EEF3F8"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, -apple-system, Segoe UI, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, Consolas, monospace"
baseFontSize = 15
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
dataframeBorderColor = "#DFE7F0"
dataframeHeaderBackgroundColor = "#F7F9FC"
dataframeHeaderTextColor = "#63748B"
chartCategoricalColors = ["#07966F", "#F5B942", "#E5485D", "#63748B", "#3478F6", "#8B5CF6", "#0EA5E9", "#F97316", "#14B8A6", "#94A3B8"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FB"
textColor = "#183153"
borderColor = "#DFE7F0"

[client]
# Tracebacks go to the server log, never to the page
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
headless = true
maxUploadSize = 20

[browser]
gatherUsageStats = false
